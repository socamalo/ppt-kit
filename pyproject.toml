[project]
name = "ppt-kit"
version = "0.1.0"
description = "File-based PowerPoint CRUD CLI: read slides as addressable text blocks, edit text in place without losing formatting, add/delete/duplicate/move slides, write notes, insert text boxes, pictures and tables."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["pptx", "powerpoint", "cli", "slides", "presentation", "automation", "python-pptx"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
    "Environment :: Console",
]
dependencies = [
    "python-pptx>=1.0.2",
]

[project.scripts]
ppt = "pptkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pptkit"]
